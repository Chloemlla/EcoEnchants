    header:
      - "&a&lEcoEnchants &7- &f可用命令 / Available Commands"
    gui:
      - "&e/ecoenchants gui &7- 打开附魔浏览器 / Open the enchant browser"
    search:
      - "&e/ecoenchants search <关键词> &7- 搜索附魔 / Search enchantments"
