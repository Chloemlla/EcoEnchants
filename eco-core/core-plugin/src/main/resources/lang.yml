      name: "&b排序方式 / Sort: &f%current%"
      lore:
        - "&7点击切换排序：名称 / 稀有度 / 最高等级"
        - "&8Click to cycle: name / rarity / max level"
        - ""
        - "&e便捷提示 / Quick Tip"
        - "&7排序只影响你自己当前的浏览"
        - "&8Sorting only affects your own current view"
