    header:
      - "&a我的收藏 / Favorites &7(%count%) — 点击查看 / click to view"
    line:
      - "&7- %enchant%"
    hover:
      - "&7点击查看 %enchant% &7详情 / Click to view details"
    empty:
      - "&e你还没有收藏任何附魔 / No favorites yet. &7在附魔详情界面点星标即可收藏，或用 &f/ecoenchants gui&7。"
  enchantinfo:
    held-header:
      - "&a手持物品附魔 / Held item enchantments &7(%count%) — 点击查看 / click to view"
    held-line:
      - "&7- %enchant%"
    held-hover:
      - "&7点击查看 %enchant% &7详情 / Click to view details"
  guide:
    lines:
      - "&a&lEcoEnchants 指南 / Guide"
      - "&7当前加载附魔 / Loaded enchants: &f%enchant_count%"
