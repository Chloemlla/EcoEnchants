gui:
  common:
    close:
      name: "&c关闭 / Close"
      lore:
        - "&7关闭当前界面"
        - "&8Close this menu"
    back:
      name: "&f返回 / Back"
      lore:
        - "&7返回附魔浏览"
        - "&8Return to the enchant browser"
    back-to-groups:
      name: "&f返回分组 / Back to Groups"
      lore:
        - "&7回到附魔分组列表"
