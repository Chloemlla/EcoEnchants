        default: "&f默认 / Default"
        name: "&f名称 / Name"
        rarity: "&f稀有度 / Rarity"
        level: "&f最高等级 / Max Level"
    conflict-view:
      name: "&6冲突查看 / Conflicts"
      lore:
        - "&7点击查看当前物品会阻止哪些附魔"
        - "&8Click to see enchants blocked by current item"
        - ""
        - "&e便捷提示 / Quick Tip"
        - "&7先把物品放到顶部中间槽位"
        - "&8Place an item in the top middle slot first"

  group:
    title: "&8附魔分组 / Enchantment Groups"
    all:
      name: "&a全部附魔 / All Enchantments"
      lore:
        - "&f不按分组筛选，浏览完整列表"
        - "&8Browse the full unfiltered list"
    normal:
      name: "&7普通附魔 / Normal Enchantments"
      lore:
        - "&f浏览普通附魔"
        - "&8Browse normal enchantments"
        - "&7适合日常装备强化"
        - "&8Good for everyday item upgrades"
    spell:
      name: "<gradient:#0575E6:#1E3FBA>法术附魔 / Spell Enchantments"
      lore:
        - "&f浏览法术附魔"
        - "&8Browse spell enchantments"
        - "&7适合寻找主动或特殊触发效果"
        - "&8Useful for active or special trigger effects"
    special:
      name: "<gradient:#FB57EC:#EF1DEC>特殊附魔 / Special Enchantments"
      lore:
        - "&f浏览特殊附魔"
        - "&8Browse special enchantments"
        - "&7通常更强，也更需要搭配规划"
        - "&8Usually stronger and better planned around"
