      name: "&c诅咒附魔 / Curse Enchantments"
      lore:
        - "&f浏览诅咒附魔"
        - "&8Browse curse enchantments"
        - "&7查看负面效果，避免误用"
        - "&8Review downsides before using them"

  admin:
    title: "&8管理员工具 / Admin Tools"
    reload:
      name: "&a重载配置 / Reload Config"
      lore:
        - "&7重新加载 EcoEnchants 配置"
        - "&8Reload EcoEnchants configuration"
        - ""
        - "&e提示 / Tip"
        - "&7新增附魔后请让玩家重新登录"
        - "&8Players should relog after new enchants are added"
    random-book:
      name: "&d给自己随机书 / Random Book"
      lore:
        - "&7给自己一本随机附魔书"
        - "&8Give yourself a random enchanted book"
        - ""
        - "&e提示 / Tip"
        - "&7适合快速测试附魔展示与平衡"
        - "&8Useful for quick display and balance testing"

commands:
