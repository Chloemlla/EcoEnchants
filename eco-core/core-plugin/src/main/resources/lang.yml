        - "&7这个物品没有可添加的附魔"
        - "&8This item has no available enchantments"
        - ""
        - "&e提示 / Tip"
        - "&7试试换一件装备，或移除已有冲突附魔"
        - "&8Try another item or remove conflicting enchants"
      with-item-and-group-lore:
        - "&7这个物品没有可添加的 %group% 附魔"
        - "&8This item has no available %group% enchantments"
        - ""
        - "&e提示 / Tip"
        - "&7换一个分组，或取出物品查看全部附魔"
        - "&8Change group or remove the item to browse all"
    page-next:
      name: "&f下一页 / Next Page &7(%page%/%max_page%)"
      lore:
        - "&7查看后一页附魔"
        - "&8Show the next page"
    page-previous:
      name: "&f上一页 / Previous Page &7(%page%/%max_page%)"
      lore:
        - "&7查看前一页附魔"
        - "&8Show the previous page"
    admin-tools:
      name: "&c管理员工具 / Admin Tools"
      lore:
        - "&7打开 EcoEnchants 管理面板"
        - "&8Open the admin utility menu"
        - ""
        - "&e提示 / Tip"
        - "&7可快速重载配置或生成随机附魔书"
        - "&8Reload configs or generate a random book"
    filters:
      type:
        name: "&b类型筛选 / Type: &f%current%"
        lore:
          - "&7点击切换附魔类型"
          - "&8Click to cycle enchantment types"
          - ""
          - "&e便捷提示 / Quick Tip"
          - "&7筛选会保留你放入的物品"
          - "&8Filters keep your placed item"
      rarity:
        name: "&e稀有度筛选 / Rarity: &f%current%"
        lore:
          - "&7点击切换稀有度"
          - "&8Click to cycle rarities"
      target:
        name: "&a目标筛选 / Target: &f%current%"
        lore:
          - "&7点击切换适用物品类型"
          - "&8Click to cycle item targets"
      compatible-only:
        name: "&a仅显示可用 / Compatible: &f%state%"
        lore:
          - "&7点击切换是否只显示当前物品可添加的附魔"
          - "&8Click to show compatible enchants only"
          - "&7没有放入物品时会显示全部附魔"
          - "&8Without an item, all enchants are shown"
      favorites-only:
        name: "&6仅看收藏 / Favorites: &f%state%"
        lore:
          - "&7点击切换是否只显示已收藏的附魔"
          - "&8Click to show only your favorited enchants"
          - ""
          - "&e便捷提示 / Quick Tip"
          - "&7在附魔详情界面点星标即可收藏"
          - "&8Star an enchant on its info screen to favorite it"
