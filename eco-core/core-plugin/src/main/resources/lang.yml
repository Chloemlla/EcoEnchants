        - "&f下方会显示可添加的附魔"
        - "&7Available enchantments appear below"
        - ""
        - "&e便捷提示 / Quick Tips"
        - "&7直接浏览时会显示全部附魔"
        - "&8Browse without an item to see every enchantment"
        - "&7放入装备后会自动筛掉不适用或已有附魔"
        - "&8Place gear to filter to usable new enchantments"
        - "&7想精简物品描述？使用 &f/ecoenchants toggledescriptions"
        - "&8Use /ecoenchants toggledescriptions to toggle lore descriptions"
