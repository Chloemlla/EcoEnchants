      add:
        name: "&e☆ 加入收藏 / Add to Favorites"
        lore:
          - "&7点击收藏该附魔"
          - "&8Click to bookmark this enchantment"
          - ""
          - "&e便捷提示 / Quick Tip"
          - "&7使用 &f/ecoenchants favorites &7快速回看收藏"
          - "&8Use /ecoenchants favorites to revisit bookmarks"
