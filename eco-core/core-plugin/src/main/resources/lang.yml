        - "&f适用物品 / Applicable to: &a%targets%"
        - "&f冲突 / Conflicts with: &a%conflicts%"
        - "&f前置 / Requires: &a%required%"
        - "&f村民交易 / Trading: &a%tradeable%"
        - "&f战利品发现 / Discovery: &a%discoverable%"
        - "&fDiscovery - Chests: &a%discoverable_chests%"
        - "&fDiscovery - Fishing: &a%discoverable_fishing%"
        - "&fDiscovery - Mob Drops: &a%discoverable_mob_drops%"
        - "&fDiscovery - Raids: &a%discoverable_raids%"
        - "&f附魔台 / Enchanting: &a%enchantable%"
        - "&f拖放应用 / Drag and Drop: &a%drag_and_drop%"
