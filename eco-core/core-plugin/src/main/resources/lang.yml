    giverandombook:
      - "&e/ecoenchants giverandombook <player> [type/rarity] [min] [max] &7- 生成随机书 / Give a random book"
    reload:
      - "&e/ecoenchants reload &7- 重载配置 / Reload configs"
    services:
      - "&e/ecoenchants services &7- 查看后端与运行状态 / Show service status"
    experience:
      - "&e/ecoenchants experience &7- 查看玩家体验提示统计 / Show player experience stats"
  search:
    usage:
      - "&e用法 / Usage: &f/ecoenchants search <关键词/keyword>"
