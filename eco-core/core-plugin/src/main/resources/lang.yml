      name: "&c没有可显示的附魔 / No Enchantments"
      lore:
        - "&7当前没有加载可浏览的附魔"
        - "&8No enchantments are available to browse"
        - ""
        - "&e提示 / Tip"
        - "&7管理员可检查附魔配置或执行重载"
        - "&8Admins can check enchant configs or reload"
      group-lore:
        - "&7%group% 分组中没有可显示的附魔"
        - "&8No enchantments are available in %group%"
        - ""
        - "&e提示 / Tip"
        - "&7返回分组后可查看其他类型"
        - "&8Go back to browse another category"
